services:
  train:
    build: .
    image: sspdf-anomalias
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    entrypoint: ["python", "-m", "src.main"]
    command:
      - --config
      - /app/config_mapeamento.yaml
      - --input
      - /app/data/input/${INPUT_FILE:-amostra_ssp.csv}
      - --output-dir
      - /app/outputs
      - --tf-device
      - cpu

  infer:
    build: .
    image: sspdf-anomalias
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    entrypoint: ["python", "-m", "src.pipeline.inference"]
    command:
      - --models-dir
      - /app/outputs/${RUN_ID:-__SET_RUN_ID__}/models_saved
      - --config
      - /app/config_mapeamento.yaml
      - --input
      - /app/data/input/${INPUT_FILE:-amostra_ssp.csv}
      - --output
      - /app/outputs/${INFER_OUTPUT_DIR:-inference_output}
      - --tf-device
      - cpu

  train-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: sspdf-anomalias-gpu
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TF_DEVICE=${TF_DEVICE:-gpu}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    entrypoint: ["python", "-m", "src.main"]
    command:
      - --config
      - /app/config_mapeamento.yaml
      - --input
      - /app/data/input/${INPUT_FILE:-amostra_ssp.csv}
      - --output-dir
      - /app/outputs
      - --tf-device
      - ${TF_DEVICE:-gpu}

  infer-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: sspdf-anomalias-gpu
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TF_DEVICE=${TF_DEVICE:-gpu}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    entrypoint: ["python", "-m", "src.pipeline.inference"]
    command:
      - --models-dir
      - /app/outputs/${RUN_ID:-__SET_RUN_ID__}/models_saved
      - --config
      - /app/config_mapeamento.yaml
      - --input
      - /app/data/input/${INPUT_FILE:-amostra_ssp.csv}
      - --output
      - /app/outputs/${INFER_OUTPUT_DIR:-inference_output}
      - --tf-device
      - ${TF_DEVICE:-gpu}
